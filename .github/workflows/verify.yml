name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Retain verified npm tarballs and both websites for manual review
        type: boolean
        default: false
  workflow_call:
    inputs:
      upload_artifacts:
        description: Retain verified artifacts for the calling release workflow
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded branch/PR checks can stop; tag releases and manual runs must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  packages:
    # Share one checkout, dependency install, library build and browser installation.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Builds use locked npm assets and committed fixtures/notices, not source submodules.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint sources
        run: pnpm lint
      - name: Build libraries once
        run: pnpm build
      - name: Check workspace types
        run: pnpm typecheck
      - name: Unit and real PDF/OCR/storage integration tests
        run: pnpm test
      - name: Prepare and validate isolated Node and browser consumers
        run: pnpm assets && pnpm run pack
      - name: Build documentation and typecheck its examples
        # The TypeDoc build already fails on documentation validation warnings.
        run: pnpm --filter @pdfextract/documentation build && pnpm --filter @pdfextract/documentation typecheck
      - name: Build and typecheck the demo
        run: pnpm --filter @pdfextract/demo build
      - name: Install browsers once for all three suites
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test packed packages in all three browsers
        run: pnpm test:packed-browser
      - name: Check documentation links, navigation and search
        run: pnpm --filter @pdfextract/documentation test
      - name: Test the production demo in all three browsers
        run: pnpm --filter @pdfextract/demo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Plain Node minimum consumer
        run: node scripts/minimum-consumer.mjs
      - name: Upload the verified npm tarballs
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: artifacts/pdfextract-*.tgz
          if-no-files-found: error
          compression-level: 0 # Tarballs are already gzip-compressed.
          retention-days: 7
      - name: Upload verified documentation
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: packages/documentation/dist
          if-no-files-found: error
          retention-days: 7
      - name: Keep the small documentation validation report
        uses: actions/upload-artifact@v7
        with:
          name: documentation-validation
          path: artifacts/reports/documentation-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload the verified demo
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: packages/demo/dist
          if-no-files-found: error
          retention-days: 7
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-linux
          path: test-results
          retention-days: 7
